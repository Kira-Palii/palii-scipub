[project]
name = "scipub"
version = "0.1.0"
description = "Бібліотека наукових публікацій"
requires-python = ">=3.12"
dependencies = []
[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit"]
[project.scripts]
scipub = "scipub.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.ruff]
line-length = 100
target-version = "py312"